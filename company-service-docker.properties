# Spring Config
spring.config.import=optional:configserver:http://configserver:8888

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=Pali$8619216837

# Datasource
spring.datasource.url=jdbc:postgresql://postgresql:5432/company_service_db
spring.datasource.username=job_user
spring.datasource.password=Pali$8619216837

# JPA & Hibernate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update

# Server
server.port=8081

# Management & Tracing
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health
management.endpoint.shutdown.access=unrestricted
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Eureka
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# External Services
jobs.service.url=http://jobs-service:8082
companies.service.url=http://companies-service:8081
reviews.service.url=http://reviews-service:8083
