spring:
  datasource:
    url: jdbc:postgresql://postgresql:5432/company_service_db
    username: job_user
    password: Pali$8619216837
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        jdbc:
          time_zone: Asia/Kolkata
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update

server:
  port: 8081
  
management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0
    endpoints:
      web:
        exposure:
          include: "health"
    endpoint:
      shutdown:
        access: unrestricted
      health:
        show-details: always
    info:
      env:
        enabled: true
